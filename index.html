<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>勇者小隊隱藏人設鑑定</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pixel-yellow': '#F4D03F',
            'pixel-blue': '#B9D5F5',
            'pixel-sky': '#E6F0FA',
            'pixel-surface': '#FCF8ED',
            'pixel-border': '#1A1A1A',
            'pixel-btn-border-b': '#D4AC0D',
            'pixel-btn-border-r': '#F1C40F',
            'pixel-bg-dim': '#E0E0E0',
          },
          fontFamily: {
            'pixel': ['"Press Start 2P"', 'monospace'],
            'sans': ['"Noto Sans TC"', 'sans-serif'],
          },
          boxShadow: {
            'pixel': '4px 4px 0 0 rgba(26, 26, 26, 1)',
            'pixel-inner': 'inset 4px 4px 0 0 rgba(255, 255, 255, 0.4), inset -4px -4px 0 0 rgba(0, 0, 0, 0.2)',
          }
        }
      }
    }
  </script>
  <style data-purpose="custom-utilities">
    /* 確保背景圖片放大時保持像素的顆粒感，不會變模糊 */
    .pixelated { image-rendering: pixelated; }
    .border-pixel { border: 4px solid #1A1A1A; }
    input::placeholder {
      color: #9CA3AF;
      font-family: "Press Start 2P", monospace;
    }
  </style>
</head>

<!-- 重點 1：將 background.png 設為 body 的背景，固定在底部並向兩側延伸 -->
<body class="flex justify-center min-h-[100dvh] font-sans antialiased text-gray-800 bg-bottom bg-cover bg-no-repeat pixelated"
      style="background-image: url('Assets/backgroundLanding.png');">

  <!-- 重點 2：移除原本的背景色，讓中央區塊變成透明，並限制最大寬度模擬手機 -->
  <div class="w-full max-w-[400px] min-h-[100dvh] relative flex flex-col justify-center px-6">

    <!-- 漂浮的光影裝飾 (保留你原本的設定) -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
      <div class="absolute top-1/4 left-0 w-32 h-32 bg-pixel-sky opacity-50 pixelated mix-blend-overlay"></div>
      <div class="absolute top-1/2 right-0 w-48 h-48 bg-pixel-sky opacity-50 pixelated mix-blend-overlay"></div>
    </div>

    <!-- 核心內容區 (置中對齊) -->
    <main class="relative z-10 flex flex-col items-center w-full">

      <!-- 標題 -->
      <h1 class="text-xl font-bold text-center mb-6 tracking-wide drop-shadow-[0_2px_2px_rgba(255,255,255,0.8)] font-sans">
        勇者小隊隱藏人設鑑定
      </h1>

      <!-- 故事背景框 -->
      <div class="bg-pixel-yellow p-4 mb-6 relative z-10 w-full shadow-pixel" data-purpose="intro-description">
        <div class="absolute -inset-1 bg-white -z-10 shadow-pixel transform translate-x-1 translate-y-1"></div>
        <p class="text-[13px] leading-relaxed font-semibold tracking-wide">
          國王下令討伐魔王，但這支在酒館臨時拼湊的小隊似乎怪怪的......？<br/>
          一路上充滿了荒謬的突發狀況！面對這趟不受控的旅程，你會如何應對？<br/>
          來測測你在這個團隊中，究竟是神仙大腿，還是搞笑雷包！
        </p>
      </div>

      <!-- 表單區塊 -->
      <div class="bg-pixel-surface w-full p-6 shadow-pixel relative z-10" data-purpose="character-form">
        <div class="absolute -inset-1 bg-white -z-10 shadow-pixel transform translate-x-1 translate-y-1"></div>

        <div class="mb-6">
          <label class="block text-sm font-bold mb-2 tracking-widest" for="hero-name">
            勇者的大名是......
          </label>
          <input class="w-full border-pixel px-4 py-3 bg-white text-lg font-pixel focus:outline-none focus:ring-2 focus:ring-pixel-yellow transition-colors" id="hero-name" placeholder="???" type="text"/>
        </div>

        <div class="mb-8">
          <label class="block text-sm font-bold mb-3 tracking-widest">
            勇者的形象是......
          </label>
          <div class="flex justify-between gap-4">
            <!-- Female Hero Option -->
            <label class="flex-1 cursor-pointer group relative">
              <input class="peer sr-only" name="hero_gender" type="radio" value="female"/>
              <div class="bg-pixel-bg-dim p-2 flex flex-col items-center border-4 border-transparent peer-checked:border-pixel-yellow transition-colors pb-3 bg-white shadow-[inset_0_0_0_2px_#E0E0E0]">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-2 shadow-sm border border-gray-200">
                  <img alt="Female Hero Sprite" class="w-12 h-12 pixelated object-contain" src="./Assets/female.png"/>
                </div>
                <span class="text-sm font-bold text-gray-700">女勇者</span>
              </div>
            </label>
            <!-- Male Hero Option -->
            <label class="flex-1 cursor-pointer group relative">
              <input checked="" class="peer sr-only" name="hero_gender" type="radio" value="male"/>
              <div class="bg-pixel-bg-dim p-2 flex flex-col items-center border-4 border-transparent peer-checked:border-pixel-yellow transition-colors pb-3 bg-white shadow-[inset_0_0_0_2px_#E0E0E0]">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-2 shadow-sm border border-gray-200">
                  <img alt="Male Hero Sprite" class="w-12 h-12 pixelated object-contain" src="./Assets/male.png"/>
                </div>
                <span class="text-sm font-bold text-gray-700">男勇者</span>
              </div>
            </label>
          </div>
        </div>

        <button id="start-btn" class="w-full bg-pixel-yellow py-3 px-4 text-center font-bold text-gray-900 border-t-2 border-l-2 border-white border-b-4 border-r-4 border-b-pixel-btn-border-b border-r-pixel-btn-border-r shadow-sm active:translate-y-1 active:border-b-2 active:border-r-2 transition-transform select-none" type="button">
          推開酒館大門，開始冒險
        </button>
      </div>
    </main>

    <!-- 已經移除了原本用 CSS 畫的假草地，因為背景圖自帶了！ -->

  </div>

  <script>
    document.getElementById('start-btn').addEventListener('click', function() {
      const heroName = document.getElementById('hero-name').value.trim();
      if (!heroName) {
        alert("請輸入勇者的大名！");
        return;
      }
      const gender = document.querySelector('input[name="hero_gender"]:checked').value;
      localStorage.setItem('rpg_userName', heroName);
      localStorage.setItem('rpg_userGender', gender);
      localStorage.setItem('rpg_currentQuestionIndex', '0');
      const initialScores = { L: 0, O: 0, I: 0, D: 0, E: 0, G: 0, C: 0, V: 0 };
      localStorage.setItem('rpg_scores', JSON.stringify(initialScores));
      window.location.href = 'Quiz.html';
    });
  </script>
</body>
</html>
