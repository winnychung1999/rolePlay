<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>勇者小隊隱藏人設鑑定</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- overflow-hidden 確保外殼不會出現多餘的滾動條 -->
<body class="m-0 p-0 overflow-hidden bg-[#ffffff]">

  <!-- 獨立且永不中斷的背景音樂 -->
  <audio id="bgm" src="./bgm.mp3" loop></audio>

  <!-- 全域音樂開關 (懸浮在右上角，不會跟著內部網頁切換而消失) -->
  <button id="music-toggle" class="fixed top-4 right-4 z-50 bg-white border-4 border-[#1A1A1A] p-2 text-xs font-bold shadow-[4px_4px_0_0_#1A1A1A] cursor-pointer active:translate-y-1 transition-all">
    🔇 開啟音樂
  </button>

  <!-- 畫中畫視窗：直接載入你的首頁 -->
  <iframe src="Landing.html" class="w-full h-[100dvh] border-none"></iframe>

  <script>
    const bgm = document.getElementById('bgm');
    const musicToggle = document.getElementById('music-toggle');

    // 控制音樂開關的邏輯
    musicToggle.addEventListener('click', () => {
      if (bgm.paused || bgm.muted) {
        bgm.muted = false;
        bgm.play();
        musicToggle.innerText = '🔊 關閉音樂';
      } else {
        bgm.pause();
        musicToggle.innerText = '🔇 開啟音樂';
      }
    });
  </script>
</body>
</html>
