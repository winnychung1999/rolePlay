<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Cozy Pixel - Result Transition</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': '#fdf9ef',
            'surface-dim': '#dddad0',
            'primary': '#ffd93d',
            'on-primary': '#423300',
            'secondary': '#d9d9d9',
            'on-secondary': '#1e1b16',
          },
          fontFamily: {
            'pixel': ['"Press Start 2P"', 'monospace', 'sans-serif'],
          },
          boxShadow: {
            'pixel': '4px 4px 0px 0px rgba(0, 0, 0, 0.1)',
            'pixel-active': '2px 2px 0px 0px rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>
  <style data-purpose="custom-utilities">
    body {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    /* 確保背景放大時保持像素清晰度 */
    .pixelated { image-rendering: pixelated; }

    .pixel-border {
      border: 4px solid white;
      box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 0.1);
    }

    .pixel-button {
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pixel-button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<!-- 重點 1：將 background.png 設為 body 的背景，並加上 pixelated -->
<body class="flex justify-center min-h-[100dvh] m-0 p-0 text-xs sm:text-sm bg-bottom bg-cover bg-no-repeat pixelated" style="background-image: url('./Assets/backgroundLanding.png');">

  <!-- 重點 2：透明的核心容器，限制寬度以模擬手機畫面，並使用 100dvh -->
  <main class="w-full max-w-[400px] h-[100dvh] relative flex flex-col mx-auto px-6">

    <!-- 內容區塊 (垂直置中偏下，避開天空，靠近草地) -->
    <section class="flex-grow flex flex-col justify-center items-center relative z-10 pt-10 pb-20">

      <!-- 提示文字框 -->
      <article class="bg-primary text-on-primary w-full p-6 pixel-border mb-12 relative">
        <p class="leading-relaxed whitespace-pre-wrap break-words">結束了討伐魔王的旅程，你終於拖著疲憊卻又愉悅的心情回到了家！
恭喜你今天又拯救了世界！</p>
      </article>

      <!-- 動態切換區塊 -->
      <div id="dynamic-area" class="w-full flex justify-center items-center h-[80px]">
        <!-- 狀態 1：計算中 (預設顯示) -->
        <p id="loading-text" class="text-sm font-bold animate-pulse text-gray-800 tracking-widest bg-white/70 p-3 rounded pixel-border">
          正在計算你的雷包指數・・・
        </p>

        <!-- 狀態 2：按鈕 (預設隱藏) -->
        <button id="result-btn" class="hidden bg-secondary text-on-secondary w-full py-6 px-4 pixel-border pixel-button flex justify-center items-center cursor-pointer">
          <span class="font-bold">點擊查看勇者的隱藏人設！</span>
        </button>
      </div>
    </section>

    <!-- 已經移除了原本用 CSS 畫的假草地，因為背景圖自帶了！ -->

  </main>

  <!-- JS 大腦：控制時間與跳轉 -->
  <script>
    // 設定計時器，2500毫秒 (2.5秒) 後執行
    setTimeout(() => {
      // 隱藏閃爍文字
      document.getElementById('loading-text').classList.add('hidden');
      // 顯示按鈕
      document.getElementById('result-btn').classList.remove('hidden');
    }, 2500);

    // 監聽按鈕點擊，跳轉到最後的結果頁
    document.getElementById('result-btn').addEventListener('click', () => {
      window.location.href = 'Result.html';
    });
  </script>
</body>
</html>
