<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>RPG Questionnaire</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pixel-yellow': '#F4D03F',
            'pixel-surface': '#FCF8ED',
            'pixel-btn-border-b': '#D4AC0D',
            'pixel-btn-border-r': '#F1C40F',
          }
        }
      }
    }
  </script>
  <style>
    /* 確保背景放大時保持像素清晰度 */
    .pixelated { image-rendering: pixelated; }

    /* 像素風格的框線與陰影 */
    .pixel-border-box {
      border: 4px solid #1A1A1A;
    }
    .shadow-pixel {
      box-shadow: 4px 4px 0 0 rgba(26, 26, 26, 1);
    }

    /* 選項按鈕的微互動效果 */
    .pixel-button {
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pixel-button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 0 rgba(26, 26, 26, 1);
    }
  </style>
</head>

<!-- 將 body 設為滿版，並加入 transition-all 讓背景切換時有漸變效果 -->
<body id="game-body" class="flex justify-center min-h-[100dvh] font-sans antialiased text-gray-800 bg-center bg-cover bg-no-repeat pixelated transition-all duration-700">

  <!-- 透明的核心容器，限制寬度以模擬手機畫面 -->
  <main class="w-full max-w-[400px] h-[100dvh] relative flex flex-col justify-center px-6 py-8 z-10">

    <!-- 頂部：動態進度條容器 -->
    <div id="progress-bar-container" class="w-full bg-white pixel-border-box p-1.5 flex space-x-1 shadow-pixel mb-6 bg-white/90 backdrop-blur-sm">
      <!-- JS 會在這裡自動生成進度條 -->
    </div>

    <!-- 內容區塊 -->
    <div class="flex-1 flex flex-col justify-center w-full space-y-5 overflow-y-auto pb-4">

      <!-- 動態題目容器 -->
      <div id="question-text" class="w-full bg-pixel-yellow pixel-border-box p-5 text-sm font-bold leading-relaxed shadow-pixel relative">
        <div class="absolute -inset-1 bg-white -z-10 shadow-pixel transform translate-x-1 translate-y-1"></div>
        載入中...
      </div>

      <!-- 動態選項容器 -->
      <div id="options-container" class="w-full flex flex-col space-y-4 pt-2">
        <!-- JS 會在這裡自動生成按鈕 -->
      </div>

    </div>
  </main>

  <script>
    let questionsData = [];
    let currentIndex = parseInt(localStorage.getItem('rpg_currentQuestionIndex')) || 0;
    let scores = JSON.parse(localStorage.getItem('rpg_scores')) || { L: 0, O: 0, I: 0, D: 0, E: 0, G: 0, C: 0, V: 0 };

    // 1. 讀取題目 JSON
    fetch('./questions.json')
      .then(response => {
        if (!response.ok) throw new Error('找不到題目檔案啦！');
        return response.json();
      })
      .then(data => {
        questionsData = data;
        renderQuestion();
      })
      .catch(error => {
        console.error(error);
        document.getElementById('question-text').innerText = "讀取題目失敗，請確認有沒有用 Live Server 開啟網頁！";
      });

    // 2. 負責渲染畫面的函數
    function renderQuestion() {
      if (!questionsData || questionsData.length === 0) return;
      const currentQ = questionsData[currentIndex];

      // 依照 chapter 動態替換背景圖片
      const gameBody = document.getElementById('game-body');
      gameBody.style.backgroundImage = `url('./Assets/Quiz${currentQ.chapter}.png')`;

      // 更新題目文字
      document.getElementById('question-text').innerText = currentQ.scenario;

      // 更新選項按鈕
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      currentQ.options.forEach(option => {
        const btn = document.createElement('button');
        // 套用 Tailwind 與自訂的像素風 class
        btn.className = "w-full text-left bg-pixel-surface border-4 border-[#1A1A1A] p-4 text-sm font-bold leading-relaxed pixel-button shadow-pixel relative";

        btn.innerHTML = `<span class="relative z-10">${option.text}</span>`;
        btn.onclick = () => handleOptionClick(option.scores);
        optionsContainer.appendChild(btn);
      });

      // 更新進度條
      const progressContainer = document.getElementById('progress-bar-container');
      progressContainer.innerHTML = '';
      for (let i = 0; i < questionsData.length; i++) {
        const block = document.createElement('div');
        block.className = `h-2 flex-1 ${i <= currentIndex ? 'bg-[#1A1A1A]' : 'bg-gray-200'} border border-white`;
        progressContainer.appendChild(block);
      }
    }

    // 3. 處理點擊選項的邏輯
    function handleOptionClick(optionScores) {
      for (const key in optionScores) {
        scores[key] += optionScores[key];
      }
      localStorage.setItem('rpg_scores', JSON.stringify(scores));
      currentIndex++;
      localStorage.setItem('rpg_currentQuestionIndex', currentIndex);

      if (currentIndex < questionsData.length) {
        renderQuestion();
      } else {
        window.location.href = 'Loading.html';
      }
    }
  </script>
</body>
</html>
