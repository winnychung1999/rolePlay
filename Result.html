<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>勇者小隊隱藏人設鑑定 - 結算結果</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- 引入截圖函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    /* 將 body 的預設背景設為白色，這樣疊加上透明色碼時才會有明亮粉嫩的感覺 */
    body {
      font-family: 'DotGothic16', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
    }
  </style>

  <style data-purpose="pixel-theme">
    .pixel-border {
      border: 4px solid #3e2723;
      box-shadow:
        inset -4px -4px 0px 0px rgba(0,0,0,0.2),
        inset 4px 4px 0px 0px rgba(255,255,255,0.4);
      background-color: white;
    }

    .pixel-border-gold {
      border: 6px solid #d4af37;
      box-shadow:
        inset -4px -4px 0px 0px rgba(0,0,0,0.2),
        inset 4px 4px 0px 0px rgba(255,255,255,0.4),
        0 0 0 4px #3e2723;
      background-color: white;
    }

    .pixel-box-shadow {
      box-shadow: 4px 4px 0px 0px #3e2723;
    }

    .pixel-text-shadow {
      text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .bg-light-gray-header {
      background-color: #e0e0e0;
    }

    /* 自訂長條圖樣式 */
    .stat-bar {
      height: 12px;
      background-color: #e0e0e0;
      border: 2px solid #3e2723;
      width: 100%;
      position: relative;
    }
    .stat-fill {
      height: 100%;
      background-color: #3e2723;
    }
  </style>
</head>

<!-- 網頁最外層：加入過渡動畫，負責顯示滿版顏色 -->
<body id="page-body" class="flex justify-center items-center min-h-[100dvh] transition-colors duration-700">

  <!-- 結算卡片主體：限制最大高度 850px 並使用 justify-between 自動排版，免滑動、不壓扁！ -->
  <main id="capture-area" class="w-full max-w-[390px] h-[100dvh] max-h-[850px] bg-white/10 relative shadow-2xl flex flex-col p-4">

    <!-- 內容區 (利用 flex-1 與 justify-between 讓區塊自動均勻分佈，拿掉寫死的 margin) -->
    <div class="flex-1 flex flex-col justify-between">

      <!-- 標題與大頭貼 -->
      <section class="flex justify-between items-start">
        <div class="flex flex-col space-y-2 mt-2">
          <p class="text-sm font-bold text-gray-900 tracking-wide">其實勇者</p>
          <h1 id="user-name-display" class="text-2xl font-black tracking-widest text-black">【勇者】</h1>
          <p class="text-sm font-bold text-gray-900 tracking-wide">是・・・</p>
          <h2 id="character-name-display" class="text-3xl font-black mt-2 pixel-text-shadow tracking-widest text-black">
            載入中 <span class="text-xl">!</span>
          </h2>
        </div>
        <div class="w-[140px] h-[180px] pixel-border-gold flex items-center justify-center bg-white shrink-0 ml-2 overflow-hidden">
          <img id="character-img" class="w-full h-full object-cover scale-[1.1] origin-center" src="" alt="Avatar"/>
        </div>
      </section>

      <!-- 冒險日常 -->
      <section class="flex pixel-border bg-white h-auto min-h-[70px]">
        <div class="w-1/3 bg-light-gray-header flex items-center justify-center text-center p-2 border-r-4 border-[#3e2723]">
          <span class="font-bold text-sm leading-tight">你的<br/>冒險日常</span>
        </div>
        <div id="routine-display" class="w-2/3 p-3 text-[11px] leading-relaxed flex items-center text-gray-900 font-bold">
          載入中...
        </div>
      </section>

      <!-- 性格與致命弱點 -->
      <section class="flex gap-4">

        <!-- 左側：長條圖能力值 -->
        <div class="w-1/2 flex flex-col pixel-border bg-white min-h-[140px]">
          <div class="bg-light-gray-header p-2 text-center border-b-4 border-[#3e2723]">
            <span class="font-bold text-sm">你的性格・・・</span>
          </div>
          <div id="stats-container" class="flex-1 p-3 bg-white flex flex-col justify-center gap-2">
            <!-- 動態生成前四高的屬性條 -->
          </div>
        </div>

        <!-- 右側：標籤與弱點 -->
        <div class="w-1/2 flex flex-col gap-3">
          <div class="pixel-border bg-white p-2 flex-1">
            <h3 id="tag1-display" class="font-bold text-[11px] mb-1 border-b-2 border-gray-200 pb-1 text-gray-900">🗲 標籤 1</h3>
            <p id="tag2-display" class="text-[10px] mb-2 leading-tight font-bold text-gray-700">標籤 2</p>
            <p id="tag3-display" class="text-[10px] font-bold text-right text-gray-900">標籤 3</p>
          </div>

          <div class="pixel-border bg-white flex flex-col flex-1">
            <div class="bg-light-gray-header p-1.5 text-center border-b-2 border-gray-300">
              <span class="text-[11px] font-bold">你的致命弱點</span>
            </div>
            <div class="p-2 text-center flex-1 flex items-center justify-center">
              <span id="weakness-display" class="text-[12px] font-bold text-red-600">載入中...</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 完美連擊 & 互相傷害 (圖片版) -->
      <section class="flex gap-4">
        <div class="w-1/2 pixel-border bg-white flex flex-col">
          <div class="bg-white p-1.5 text-center border-b-4 border-[#3e2723]">
            <span class="font-bold text-sm">完美連擊</span>
          </div>
          <div class="flex-1 p-2 bg-light-gray-header flex flex-col items-center justify-center min-h-[80px]">
            <div id="combo-img-container" class="flex justify-center gap-2 mb-1 w-full flex-wrap"></div>
          </div>
        </div>

        <div class="w-1/2 pixel-border bg-white flex flex-col">
          <div class="bg-white p-1.5 text-center border-b-4 border-[#3e2723]">
            <span class="font-bold text-sm">互相傷害</span>
          </div>
          <div class="flex-1 p-2 bg-light-gray-header flex flex-col items-center justify-center min-h-[80px]">
            <div id="enemy-img-container" class="flex justify-center gap-2 mb-1 w-full flex-wrap"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // 1. 讀取 Storage 資訊
    const userName = localStorage.getItem('rpg_userName') || '冒險者';
    const userGender = localStorage.getItem('rpg_userGender') || 'female';
    const userScores = JSON.parse(localStorage.getItem('rpg_scores')) || { L: 3, O: 1, I: 0, D: 0, E: 0, G: 2, C: 0, V: 4 };

    let charactersDatabase = [];
    let matchedCharacter = null;

    // 2. 透過 fetch 讀取外部的 role.json
    fetch('./role.json')
      .then(response => {
        if (!response.ok) throw new Error('找不到 role.json 檔案！');
        return response.json();
      })
      .then(data => {
        charactersDatabase = data;

        // 3. 計算最高分角色 (支援官方同分優先順位 + 方案二：最高屬性門檻過濾)
        const priorityOrder = [
          "精算軍師", "硬核隊長", "千面間諜", "尋寶獵人", "混亂魔法師",
          "派對精靈", "治癒牧師", "天選勇者", "無辜村民", "吃瓜旅人"
        ];

        let maxSingleAttrScore = -1;
        let topAttributes = [];

        for (let attr in userScores) {
          let score = Number(userScores[attr] || 0);
          if (score > maxSingleAttrScore) {
            maxSingleAttrScore = score;
            topAttributes = [attr];
          } else if (score === maxSingleAttrScore) {
            topAttributes.push(attr);
          }
        }

        let eligibleCharacters = charactersDatabase.filter(char => {
          return char.attributes.some(attr => topAttributes.includes(attr));
        });

        if (eligibleCharacters.length === 0) {
          eligibleCharacters = charactersDatabase;
        }

        let scoredCharacters = eligibleCharacters.map(char => {
          let currentTotal = 0;
          char.attributes.forEach(attr => {
            currentTotal += Number(userScores[attr] || 0);
          });
          return { char: char, score: currentTotal };
        });

        let highestTotalScore = Math.max(...scoredCharacters.map(item => item.score));
        let topCandidates = scoredCharacters.filter(item => item.score === highestTotalScore).map(item => item.char);

        topCandidates.sort((a, b) => {
          let indexA = priorityOrder.indexOf(a.name);
          let indexB = priorityOrder.indexOf(b.name);
          if (indexA === -1) indexA = 999;
          if (indexB === -1) indexB = 999;
          return indexA - indexB;
        });

        matchedCharacter = topCandidates[0] || charactersDatabase[0];

        // 👑 4. 將顏色填滿整個網頁 (套用在最外層的 body 上，卡片維持純白)
        // 在 16進制色碼後面加上 'C4' (約等於 77% 的透明度)
        document.getElementById('page-body').style.backgroundColor = matchedCharacter.color + 'C4';

        // 5. 填寫文字與主圖片
        document.getElementById('user-name-display').innerText = `【${userName}】`;
        document.getElementById('character-name-display').innerHTML = `${matchedCharacter.name} <span class="text-xl">!</span>`;
        document.getElementById('routine-display').innerText = matchedCharacter.routine;
        document.getElementById('tag1-display').innerText = matchedCharacter.tag1;
        document.getElementById('tag2-display').innerText = matchedCharacter.tag2;
        document.getElementById('tag3-display').innerText = matchedCharacter.tag3;
        document.getElementById('weakness-display').innerText = matchedCharacter.weakness;

        document.getElementById('character-img').src = userGender === 'female' ? matchedCharacter.femaleImg : matchedCharacter.maleImg;

        // 6. 渲染長條圖 (前四高屬性，帶中文翻譯)
        const statsContainer = document.getElementById('stats-container');
        const attributeMap = {
          "L": "邏輯", "O": "細節", "I": "直覺", "D": "偽裝",
          "E": "共情", "G": "領導", "C": "佛系", "V": "氣氛"
        };

        const sortedScores = Object.entries(userScores).sort((a, b) => b[1] - a[1]).slice(0, 4);
        const maxScore = Math.max(sortedScores[0][1], 1);

        sortedScores.forEach(([key, value]) => {
          const percentage = (value / maxScore) * 100;
          const chineseName = attributeMap[key] || key;

          statsContainer.innerHTML += `
            <div class="flex items-center text-xs font-bold gap-2 w-full">
              <span class="w-8 text-right text-gray-800 shrink-0">${chineseName}</span>
              <div class="stat-bar flex-2"><div class="stat-fill" style="width: ${percentage}%"></div></div>
            </div>
          `;
        });

        // 7. 渲染連擊/傷害頭像
        renderMiniAvatars('combo-img-container', matchedCharacter.combo);
        renderMiniAvatars('enemy-img-container', matchedCharacter.enemy);

      })
      .catch(error => {
        console.error(error);
        alert('無法載入角色資料，請確認是否使用 Live Server 開啟！');
      });

    function renderMiniAvatars(containerId, charNames) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      charNames.forEach(name => {
        const foundChar = charactersDatabase.find(c => c.name === name);
        if (foundChar) {
          const imgSrc = userGender === 'female' ? foundChar.femaleImg : foundChar.maleImg;
          container.innerHTML += `
            <div class="flex flex-col items-center gap-1">
              <div class="w-16 h-20 bg-white border-2 border-[#3e2723] overflow-hidden shrink-0">
                <img src="${imgSrc}" class="w-full h-full object-cover p-0.5"/>
              </div>
              <span class="text-[10px] font-bold text-gray-800 leading-tight">${name}</span>
            </div>
          `;
        }
      });
    }

  </script>
</body>
</html>
